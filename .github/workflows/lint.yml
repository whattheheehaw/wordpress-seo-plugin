name: Lint

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: none

      - name: Lint all PHP files
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          exit $status
